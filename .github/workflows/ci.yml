name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: 静态检查（无 GPU）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装静态检查依赖
        run: python -m pip install --upgrade pip pyyaml ruff
      - name: 运行静态层
        run: bash tests/ci_static.sh

  functional:
    name: 功能链路（无 GPU：api 槽位 + CLI）
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: api 槽位全链路（自起本地 fake OpenAI 服务）
        run: python3 tests/test_api_slot.py
      - name: CLI 离线功能
        run: python3 tests/test_cli.py

  integration:
    name: GPU 集成审计（self-hosted）
    # 需要一台已部署模型与 pylib 的 GPU 机器，并给 runner 打上 gpu 标签。
    # 该 job 会独占 GPU 启动服务，结束后自动停服；不要与生产实例共用同一组端口。
    # 默认不让 push 自动排队等 runner：配置好自托管 runner 后，
    # 把仓库变量 ENABLE_GPU_CI 设为 true 即可启用；手动 workflow_dispatch 总是执行。
    runs-on: [self-hosted, linux, gpu]
    needs: static
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_GPU_CI == 'true' &&
       github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 环境前置检查
        run: |
          python3 --version
          (nvidia-smi || rocm-smi) | head -20 || true
          test -d pylib && echo "pylib OK" || echo "pylib 缺失：请按 OPERATIONS.md 部署依赖"
      - name: 运行集成审计
        run: bash tests/ci_integration.sh
