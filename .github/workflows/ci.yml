name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: 静态检查（无 GPU）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装静态检查依赖
        run: python -m pip install --upgrade pip pyyaml ruff
      - name: 运行静态层
        run: bash tests/ci_static.sh

  integration:
    name: GPU 集成审计（self-hosted）
    # 需要一台已部署模型与 pylib 的 GPU 机器，并给 runner 打上 gpu 标签。
    # 该 job 会独占 GPU 启动服务，结束后自动停服；不要与生产实例共用同一组端口。
    runs-on: [self-hosted, linux, gpu]
    needs: static
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 环境前置检查
        run: |
          python3 --version
          (nvidia-smi || rocm-smi) | head -20 || true
          test -d pylib && echo "pylib OK" || echo "pylib 缺失：请按 OPERATIONS.md 部署依赖"
      - name: 运行集成审计
        run: bash tests/ci_integration.sh
